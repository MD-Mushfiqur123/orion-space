
<div id="command-dock" class="fixed bottom-6 left-1/2 z-50 pointer-events-auto" aria-label="Visual preset modes and timeline">
  <div id="location-bar" class="collapsed">
    <div class="location-inner">
      <div class="location-toolbar">
        <button id="location-bar-toggle" type="button" class="dock-tray-toggle" data-dock-toggle-target="location-bar" aria-controls="location-bar-popover" aria-expanded="false" aria-label="Expand LOCATION">
          <span class="dock-label-icon dock-label-icon-location" aria-hidden="true"></span>
          <span class="location-toolbar-label">LOCATION</span>
        </button>
        <button class="panel-collapse-btn" data-collapse-target="location-bar" aria-label="Expand LOCATION">+</button>
      </div>
      <div id="location-bar-popover" class="dock-popover-content"></div>
    </div>
  </div>
  <div id="control-panel">
    <button id="control-panel-toggle" data-dock-toggle-target="control-panel" aria-controls="control-panel-popover" aria-expanded="true" class="dock-group-label sr-only" title="Visual presets tray" tabindex="-1" aria-hidden="true">PRESETS</button>
    <div id="control-panel-popover" class="border-0 p-0 m-0 bg-transparent shadow-none">
      <div id="style-buttons" class="flex items-center gap-1.5" role="toolbar" aria-label="View style and tools">
        <span class="dock-group-label" aria-hidden="true">VIEW</span>
        <button class="style-btn active px-3.5 py-2 rounded-xl text-[10.5px] font-bold tracking-wider text-black bg-white transition-all border border-white" data-style="normal" data-short="NORMAL" title="Normal 3D Earth Globe">
          <span class="btn-label">NORMAL</span>
        </button>
        <button class="style-btn px-3.5 py-2 rounded-xl text-[10.5px] font-semibold tracking-wider text-zinc-100 hover:text-white bg-white/10 hover:bg-white/20 transition-all border border-white/20 hover:border-white/40" data-style="thermal" data-short="FLIR" title="FLIR Thermal Anomaly Detection">
          <span class="btn-label">FLIR THERMAL</span>
        </button>
        <button class="style-btn px-3.5 py-2 rounded-xl text-[10.5px] font-semibold tracking-wider text-zinc-100 hover:text-white bg-white/10 hover:bg-white/20 transition-all border border-white/20 hover:border-white/40" data-style="noir" data-short="NOIR" title="Swiss Monochrome Minimalist Noir">
          <span class="btn-label">NOIR</span>
        </button>
        <button class="style-btn px-3.5 py-2 rounded-xl text-[10.5px] font-semibold tracking-wider text-zinc-100 hover:text-white bg-white/10 hover:bg-white/20 transition-all border border-white/20 hover:border-white/40" data-style="surveillance" data-short="NVG" title="Night Vision Sensor Pass">
          <span class="btn-label">NVG</span>
        </button>
        <button class="style-btn px-3.5 py-2 rounded-xl text-[10.5px] font-semibold tracking-wider text-zinc-100 hover:text-white bg-white/10 hover:bg-white/20 transition-all border border-white/20 hover:border-white/40" data-style="retro" data-short="CRT" title="High Contrast Tactical CRT">
          <span class="btn-label">CRT</span>
        </button>
        <div class="w-px h-6 bg-white/20 mx-1" aria-hidden="true"></div>
        <button id="real-earth-clouds-dock-btn" data-short="CLOUDS" class="style-btn px-3.5 py-2 rounded-xl text-[10.5px] font-semibold tracking-wider text-sky-200 hover:text-white bg-sky-500/15 hover:bg-sky-500/25 transition-all border border-sky-400/30 hover:border-sky-400/50" title="Toggle Real Earth Cloud Stream (NASA Satellite)" aria-pressed="false">
          <span class="btn-label">REAL CLOUDS</span>
        </button>
        <button id="orion-harness-dock-btn" data-short="AGENT" class="style-btn px-4 py-2 rounded-xl text-[10.5px] font-bold tracking-wider text-emerald-300 bg-emerald-500/15 hover:bg-emerald-500/30 transition-all border border-emerald-500/30 hover:border-emerald-400/60 shadow-[0_0_15px_rgba(16,185,129,0.15)] flex items-center gap-2" title="Ask the AI map agent (Space)" aria-label="Open the AI map agent">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span class="btn-label">AI AGENT</span>
        </button>
      </div>
    </div>
  </div>
</div>
