
<aside id="left-control-rail" class="flex flex-col gap-4">
  <div id="left-panel-stack" class="flex flex-col gap-6">
    <!-- NASA Data Layers -->
    <div id="data-panel" class="panel-collapsible active" data-panel-id="data-panel">
      <div class="panel-header mb-2 pb-2 border-b border-white/10">
        <span class="text-xs font-semibold tracking-wider text-white">NASA DATA LAYERS</span>
      </div>
      <div id="data-toggles" class="data-toggle-list"></div>
      
      <!-- Globe Marker / Dot Legend Guide -->
      <div id="layer-dot-legend" class="mt-3 p-3 bg-white/[0.025] border border-white/[0.06] rounded-xl">
        <div class="text-[9px] font-bold text-zinc-500 mb-2 tracking-[0.12em] uppercase font-sans flex items-center gap-1.5">
          <span class="material-symbols-outlined text-[14px] text-zinc-600">sensors</span> GLOBE DOT & SENSOR LEGEND:
        </div>
        <div class="grid grid-cols-2 gap-2 text-[10px] text-zinc-400 font-mono">
          <div class="flex items-center gap-2">
            <span class="w-1.5 h-1.5 rounded-full bg-white border border-white/40 shadow-[0_0_5px_rgba(255,255,255,0.5)]"></span>
            <span>MERRA-2 Grid</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="w-1.5 h-1.5 rounded-full bg-orange-500 border border-orange-500/40 shadow-[0_0_5px_rgba(249,115,22,0.5)]"></span>
            <span>VIIRS Fire</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="w-1.5 h-1.5 rounded-full bg-sky-400 border border-sky-400/40 shadow-[0_0_5px_rgba(56,189,248,0.5)]"></span>
            <span>Live Aircraft</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="w-1.5 h-1.5 rounded-full bg-yellow-400 border border-yellow-400/40 shadow-[0_0_5px_rgba(250,204,21,0.5)]"></span>
            <span>Lightning Strike</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Locations & POI Navigation -->
    <div id="location-panel" class="panel-collapsible active" data-panel-id="location-panel">
      <div class="panel-header mb-2 pb-2 border-b border-white/10">
        <span class="text-xs font-semibold tracking-wider text-white">LOCATIONS & HOTSPOTS</span>
      </div>
      <div class="location-body flex flex-col gap-3">
        <div class="location-search-wrap">
          <input type="text" id="location-search" class="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2 text-xs text-white placeholder-zinc-600 focus:outline-none focus:border-white/30 focus:ring-1 focus:ring-white/20 transition-all" placeholder="Search coordinates / cities..." autocomplete="off" spellcheck="false" />
        </div>
        <div id="location-pills" class="location-pills flex flex-wrap gap-1.5"></div>
        <div id="poi-row" class="poi-row-container flex flex-wrap gap-1.5 text-[10px]"></div>
      </div>
    </div>

    <!-- Director Camera Scenes -->
    <div id="scene-panel" class="panel-collapsible active" data-panel-id="scene-panel">
      <div class="panel-header mb-2 pb-2 border-b border-white/10">
        <span class="text-xs font-semibold tracking-wider text-white">DIRECTOR CAMERA</span>
      </div>
      <div class="scene-controls flex flex-col gap-2">
        <select id="scene-select" class="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-white/30 cursor-pointer appearance-none"></select>
        <div class="flex gap-2">
          <button id="scene-start-btn" class="flex-1 bg-white/5 border border-white/10 hover:bg-white/10 hover:border-white/20 transition-all rounded-lg py-2.5 text-[11px] font-bold tracking-wider text-white">PLAY TOUR</button>
          <button id="scene-stop-btn" class="flex-1 bg-black/40 border border-white/10 hover:bg-white/5 transition-all rounded-lg py-2.5 text-[11px] font-bold tracking-wider text-zinc-400 hover:text-white">STOP</button>
        </div>
      </div>
    </div>
  </div>
</aside>
